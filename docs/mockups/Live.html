<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sightline Live</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Roboto+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#7DB8FF}a:hover{color:#A9D0FF}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E1114; color: #E8ECEF; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px 4px 20px">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 20px; font-weight: 600">Live</span>
      <span style="font-size: 12px; color: #9AA4AE">Living room HDHomeRun · Tuner 1</span>
    </div>
    <button aria-label="Settings" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: transparent; color: #C5CDD4; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>
    </button>
  </header>

  <div style="display: flex; align-items: center; justify-content: center; gap: 8px; padding: 6px 16px">
    <button aria-label="Previous channel" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #2A3138; background: #171B20; color: #C5CDD4; font-size: 20px">‹</button>
    <div style="flex: 1; height: 44px; border-radius: 22px; background: #171B20; border: 1px solid #2A3138; display: flex; align-items: center; justify-content: center; gap: 8px">
      <span style="font-family: 'Roboto Mono', monospace; font-weight: 600; font-size: 16px">9.1</span>
      <span style="font-size: 15px; font-weight: 500">Station-HD</span>
    </div>
    <button aria-label="Next channel" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #2A3138; background: #171B20; color: #C5CDD4; font-size: 20px">›</button>
  </div>

  <div style="display: flex; justify-content: center; padding-top: 4px">
    <svg width="280" height="232" viewBox="0 0 240 200" role="img" aria-label="Signal quality 86 of 100, session best 91">
      <path d="M56.4 173.6A90 90 0 1 1 183.6 173.6" fill="none" stroke="#232A31" stroke-width="16" stroke-linecap="round"></path>
      <path d="M56.4 173.6A90 90 0 1 1 209.3 121.3" fill="none" stroke="#4CC38A" stroke-width="16" stroke-linecap="round"></path>
      <line x1="218.8" y1="94.4" x2="197" y2="97.8" stroke="#E8ECEF" stroke-width="2.5"></line>
      <circle cx="204.2" cy="141.8" r="6.5" fill="#0E1114" stroke="#E8ECEF" stroke-width="2.5"></circle>
      <text x="120" y="122" text-anchor="middle" font-family="Roboto Mono, monospace" font-size="58" font-weight="600" fill="#E8ECEF">86</text>
      <text x="120" y="146" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#9AA4AE">Signal quality</text>
      <text x="120" y="190" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#9AA4AE">Best 91</text>
    </svg>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding: 0 20px">
    <div style="background: #171B20; border-radius: 16px; padding: 10px 8px 12px; display: flex; flex-direction: column; align-items: center; gap: 2px">
      <svg width="96" height="80" viewBox="0 0 100 86" role="img" aria-label="Signal strength 88">
        <path d="M24.5 73.5A36 36 0 1 1 75.5 73.5" fill="none" stroke="#232A31" stroke-width="9" stroke-linecap="round"></path>
        <path d="M24.5 73.5A36 36 0 1 1 85.1 55.9" fill="none" stroke="#4CC38A" stroke-width="9" stroke-linecap="round"></path>
        <text x="50" y="56" text-anchor="middle" font-family="Roboto Mono, monospace" font-size="24" font-weight="600" fill="#E8ECEF">88</text>
      </svg>
      <span style="font-size: 13px; color: #9AA4AE">Strength</span>
    </div>
    <div style="background: #171B20; border-radius: 16px; padding: 10px 8px 12px; display: flex; flex-direction: column; align-items: center; gap: 2px">
      <svg width="96" height="80" viewBox="0 0 100 86" role="img" aria-label="Symbol quality 100">
        <path d="M24.5 73.5A36 36 0 1 1 75.5 73.5" fill="none" stroke="#4CC38A" stroke-width="9" stroke-linecap="round"></path>
        <text x="50" y="56" text-anchor="middle" font-family="Roboto Mono, monospace" font-size="24" font-weight="600" fill="#E8ECEF">100</text>
      </svg>
      <span style="font-size: 13px; color: #9AA4AE">Symbol quality</span>
    </div>
  </div>

  <div style="padding: 14px 20px 0; display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; justify-content: space-between; font-size: 12px; color: #9AA4AE"><span>Signal quality · last 60 s</span><span>threshold 80</span></div>
    <svg width="350" height="44" viewBox="0 0 350 44" role="img" aria-label="Sparkline of signal quality over the last minute with one brief dip">
      <line x1="0" y1="26" x2="350" y2="26" stroke="#3A434C" stroke-dasharray="3 3"></line>
      <path d="M0 14L24 12L48 15L72 13L96 14L120 16L144 30L168 38L192 22L216 14L240 12L264 15L288 13L312 14L336 12L350 13" fill="none" stroke="#7DB8FF" stroke-width="2" stroke-linejoin="round"></path>
    </svg>
  </div>

  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; padding: 12px 20px 0">
    <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #9AA4AE">RF</span><span style="font-family: 'Roboto Mono', monospace; font-size: 14px">35</span></div>
    <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #9AA4AE">Band</span><span style="font-size: 14px">UHF</span></div>
    <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #9AA4AE">Freq</span><span style="font-family: 'Roboto Mono', monospace; font-size: 14px">599 MHz</span></div>
    <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #9AA4AE">Lock</span><span style="font-size: 14px">8VSB</span></div>
  </div>

  <div style="margin: 14px 20px 0; padding: 12px 14px; border-radius: 14px; background: rgba(76,195,138,0.12); border: 1px solid rgba(76,195,138,0.5); display: flex; gap: 10px; align-items: center">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4CC38A" stroke-width="2.4" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
    <div style="display: flex; flex-direction: column; gap: 1px">
      <span style="font-size: 14px; font-weight: 600">Good</span>
      <span style="font-size: 12px; color: #C5CDD4">Clean signal, no symbol errors.</span>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 14px 20px 0">
    <a href="Aim.html" style="height: 44px; border-radius: 22px; background: #5AA9FF; color: #0E1114; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">Aim</a>
    <a href="Sweep.html" style="height: 44px; border-radius: 22px; border: 1px solid #2A3138; color: #E8ECEF; font-size: 14px; font-weight: 500; display: flex; align-items: center; justify-content: center; text-decoration: none">Sweep</a>
    <a href="Monitor.html" style="height: 44px; border-radius: 22px; border: 1px solid #2A3138; color: #E8ECEF; font-size: 14px; font-weight: 500; display: flex; align-items: center; justify-content: center; text-decoration: none">Monitor</a>
  </div>

  <nav style="margin-top: auto; height: 72px; border-top: 1px solid #1F252B; background: #12161A; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: center">
    <a href="Devices.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #9AA4AE; font-size: 12px; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="7" width="18" height="10" rx="2"></rect><path d="M7 17v2M17 17v2"></path></svg>Devices</a>
    <a href="Live.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #7DB8FF; font-size: 12px; font-weight: 600; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 16a8 8 0 1 1 16 0"></path><path d="M12 16l4-5"></path></svg>Live</a>
    <a href="Monitor.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #9AA4AE; font-size: 12px; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 12h4l3-7 4 14 3-7h4"></path></svg>Monitor</a>
    <a href="Session.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #9AA4AE; font-size: 12px; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M12 8v4l3 2"></path></svg>History</a>
  </nav>
</div>
</body>
</html>
