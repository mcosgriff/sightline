<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sightline Aim</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Roboto+Mono:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#7DB8FF}a:hover{color:#A9D0FF}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #000000; color: #F2F5F7; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; align-items: center; gap: 8px; padding: 12px 16px 0 8px">
    <a href="Live.html" aria-label="Back to Live" style="width: 44px; height: 44px; border-radius: 22px; color: #C5CDD4; display: flex; align-items: center; justify-content: center; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <div style="display: flex; flex-direction: column; gap: 1px; flex: 1">
      <span style="font-size: 17px; font-weight: 600">Aim · 9.1 Station-HD</span>
      <span style="font-size: 12px; color: #9AA4AE">RF 35 UHF · tuner 1 · hold phone to the mast</span>
    </div>
  </header>

  <div style="display: flex; flex-direction: column; align-items: center; padding-top: 10px">
    <span style="font-size: 13px; color: #9AA4AE; letter-spacing: 0.08em">SIGNAL QUALITY</span>
    <span style="font-family: 'Roboto Mono', monospace; font-size: 128px; font-weight: 700; line-height: 1; color: #4CC38A">88</span>
    <div style="display: flex; align-items: baseline; gap: 10px; margin-top: 4px">
      <span style="font-size: 15px; color: #C5CDD4">Best <span style="font-family: 'Roboto Mono', monospace; font-weight: 600; color: #F2F5F7">91</span> at <span style="font-family: 'Roboto Mono', monospace; font-weight: 600; color: #F2F5F7">247°</span></span>
      <span style="font-size: 15px; color: #9AA4AE">· now 252°</span>
    </div>
  </div>

  <div style="padding: 14px 32px 0; display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; justify-content: space-between; font-size: 12px; color: #9AA4AE"><span>Symbol quality</span><span style="font-family: 'Roboto Mono', monospace; color: #F2F5F7">100</span></div>
    <div style="height: 8px; border-radius: 4px; background: #1C2227"><div style="width: 100%; height: 8px; border-radius: 4px; background: #4CC38A"></div></div>
    <div style="display: flex; justify-content: space-between; font-size: 12px; color: #9AA4AE; margin-top: 4px"><span>Second tuner · 4.1</span><span style="font-family: 'Roboto Mono', monospace; color: #F2B33D">72 marginal</span></div>
  </div>

  <div style="display: flex; justify-content: center; padding-top: 8px">
    <svg width="320" height="320" viewBox="0 0 300 300" role="img" aria-label="Polar plot of signal quality by compass heading, peaking near 247 degrees">
      <circle cx="150" cy="150" r="130" fill="none" stroke="#2A3138"></circle>
      <circle cx="150" cy="150" r="104" fill="none" stroke="#2A3138" stroke-dasharray="3 4"></circle>
      <circle cx="150" cy="150" r="78" fill="none" stroke="#1F252B"></circle>
      <line x1="150" y1="20" x2="150" y2="280" stroke="#1F252B"></line>
      <line x1="20" y1="150" x2="280" y2="150" stroke="#1F252B"></line>
      <text x="150" y="14" text-anchor="middle" font-size="12" font-family="Inter, sans-serif" fill="#9AA4AE">N</text>
      <text x="292" y="154" text-anchor="middle" font-size="12" font-family="Inter, sans-serif" fill="#9AA4AE">E</text>
      <text x="150" y="296" text-anchor="middle" font-size="12" font-family="Inter, sans-serif" fill="#9AA4AE">S</text>
      <text x="8" y="154" text-anchor="middle" font-size="12" font-family="Inter, sans-serif" fill="#9AA4AE">W</text>
      <text x="156" y="44" font-size="10" font-family="Inter, sans-serif" fill="#6B7580">100</text>
      <text x="156" y="70" font-size="10" font-family="Inter, sans-serif" fill="#6B7580">80</text>
      <line x1="150" y1="150" x2="30.3" y2="200.8" stroke="#4CC38A" stroke-width="1.5" stroke-dasharray="5 4"></line>
      <line x1="30.4" y1="205.8" x2="19.5" y2="210.9" stroke="#F2B33D" stroke-width="3"></line>
      <path d="M150 208.5L126.9 213.5L111 217.5L93.2 217.7L71.3 216L50.9 207.2L41.1 196.2L41.2 189.6L45 168.5L57.7 150L70.6 136L82.8 125.5L96 118.8" fill="rgba(90,169,255,0.14)" stroke="#5AA9FF" stroke-width="2" stroke-linejoin="round"></path>
      <circle cx="126.9" cy="213.5" r="3" fill="#5AA9FF"></circle>
      <circle cx="111" cy="217.5" r="3" fill="#5AA9FF"></circle>
      <circle cx="93.2" cy="217.7" r="3" fill="#5AA9FF"></circle>
      <circle cx="71.3" cy="216" r="3" fill="#5AA9FF"></circle>
      <circle cx="50.9" cy="207.2" r="3" fill="#5AA9FF"></circle>
      <circle cx="41.1" cy="196.2" r="6" fill="#4CC38A" stroke="#000000" stroke-width="2"></circle>
      <circle cx="41.2" cy="189.6" r="3" fill="#5AA9FF"></circle>
      <circle cx="45" cy="168.5" r="3" fill="#5AA9FF"></circle>
      <circle cx="57.7" cy="150" r="3" fill="#5AA9FF"></circle>
      <circle cx="70.6" cy="136" r="3" fill="#5AA9FF"></circle>
      <circle cx="82.8" cy="125.5" r="3" fill="#5AA9FF"></circle>
      <path d="M150 150L40.6 185.5" stroke="#F2F5F7" stroke-width="2.5" stroke-linecap="round"></path>
      <circle cx="150" cy="150" r="4" fill="#F2F5F7"></circle>
    </svg>
  </div>

  <div style="display: flex; justify-content: center; gap: 16px; font-size: 12px; color: #9AA4AE; padding-top: 2px">
    <span style="display: flex; align-items: center; gap: 5px"><span style="width: 14px; height: 2px; background: #F2F5F7"></span>Phone heading</span>
    <span style="display: flex; align-items: center; gap: 5px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #4CC38A"></span>Best</span>
    <span style="display: flex; align-items: center; gap: 5px"><span style="width: 10px; height: 3px; background: #F2B33D"></span>Tower A 245°</span>
  </div>

  <div style="margin-top: auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 0 16px 24px">
    <button aria-pressed="true" style="height: 52px; border-radius: 14px; border: none; background: #5AA9FF; color: #000000; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 10v4h4l5 4V6L8 10z"></path><path d="M16 9a4 4 0 0 1 0 6"></path></svg>Tone on</button>
    <button aria-pressed="true" style="height: 52px; border-radius: 14px; border: 1px solid #2A3138; background: #12161A; color: #F2F5F7; font-size: 14px; font-weight: 500">Haptics on</button>
    <button style="height: 52px; border-radius: 14px; border: 1px solid #2A3138; background: #12161A; color: #F2F5F7; font-size: 14px; font-weight: 500">Reset peak</button>
  </div>
</div>
</body>
</html>
